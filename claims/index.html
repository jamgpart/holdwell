<style>

  --crit:#B3402E; --crit-soft:#F5DDD8; --info:#2F5D9E; --info-soft:#DCE6F5; --shadow:0 10px 30px rgba(18,26,23,.10);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --ground:#0C1210; --surface:#16201C; --surface2:#1C2823; --surface3:#233129; --ink:#EEF3EF; --ink2:#AEBBB3; --ink3:#7E8C85;
    --line:#2A3630; --accent:#5CC9A8; --accent-ink:#0B1A15; --accent-soft:#183129; --amber:#E4A24A; --amber-soft:#3A2B14;
    --crit:#E6705C; --crit-soft:#3C1E19; --info:#7FA8E6; --info-soft:#1B2A40; --shadow:0 10px 30px rgba(0,0,0,.45);
  }
}
:root[data-theme="dark"]{
  --ground:#0C1210; --surface:#16201C; --surface2:#1C2823; --surface3:#233129; --ink:#EEF3EF; --ink2:#AEBBB3; --ink3:#7E8C85;
  --line:#2A3630; --accent:#5CC9A8; --accent-ink:#0B1A15; --accent-soft:#183129; --amber:#E4A24A; --amber-soft:#3A2B14;
  --crit:#E6705C; --crit-soft:#3C1E19; --info:#7FA8E6; --info-soft:#1B2A40; --shadow:0 10px 30px rgba(0,0,0,.45);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;height:100%}
body{background:var(--ground);color:var(--ink);font-family:"IBM Plex Sans",system-ui,-apple-system,Segoe UI,sans-serif;font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased}
.mono{font-family:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;font-variant-numeric:tabular-nums}
h1,h2,h3,h4{font-family:"Bricolage Grotesque","IBM Plex Sans",system-ui,sans-serif;font-weight:700;letter-spacing:-.01em;text-wrap:balance;margin:0}
h1{font-size:22px}h2{font-size:18px}h3{font-size:15px}h4{font-size:13px;color:var(--ink2);text-transform:uppercase;letter-spacing:.06em;font-weight:600;font-family:"IBM Plex Sans",sans-serif}
p{margin:0}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
button:focus-visible,[tabindex]:focus-visible{outline:3px solid var(--amber);outline-offset:2px}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

.top{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:10px 18px;background:var(--surface);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:10}
.wordmark{display:flex;align-items:center;gap:8px;font-family:"Bricolage Grotesque",sans-serif;font-weight:800;font-size:18px;letter-spacing:-.02em}
.wordmark .mark{width:24px;height:24px;border-radius:7px;background:var(--accent);display:grid;place-items:center}
.wordmark .mark svg{width:15px;height:15px;color:var(--accent-ink)}
.wordmark span.sub{font-weight:500;color:var(--ink3);font-size:14px;margin-left:6px;letter-spacing:0}
.stats{display:flex;gap:18px}
.stat{display:flex;flex-direction:column;line-height:1.1}
.stat b{font-family:"Bricolage Grotesque",sans-serif;font-size:18px;font-weight:700;font-variant-numeric:tabular-nums}
.stat span{font-size:11px;color:var(--ink3);text-transform:uppercase;letter-spacing:.06em;font-weight:600}
.iconbtn{width:34px;height:34px;border-radius:9px;display:grid;place-items:center;color:var(--ink3)}
.iconbtn:hover{background:var(--surface2)}
.layout{display:grid;grid-template-columns:300px 1fr;min-height:calc(100dvh - 55px)}
@media(max-width:900px){.layout{grid-template-columns:1fr}.queue{border-right:0;border-bottom:1px solid var(--line);max-height:220px;overflow:auto}}
.queue{border-right:1px solid var(--line);background:var(--ground);padding:12px 12px;display:flex;flex-direction:column;gap:8px}
.queue h4{padding:4px 4px 0}
.q{display:grid;grid-template-columns:1fr auto;gap:3px 8px;padding:12px 13px;border-radius:14px;width:100%;text-align:left;border:1px solid var(--line);background:var(--surface);box-shadow:0 1px 0 rgba(18,26,23,.04),0 4px 14px rgba(18,26,23,.06)}
.q:hover{border-color:var(--ink3)}
.q.on{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft),0 4px 14px rgba(18,26,23,.06)}
.q .id{font-size:12px;color:var(--ink3)}
.q .veh{font-weight:600;font-size:14px}
.q .sub{font-size:12px;color:var(--ink2);grid-column:1}
.q .amt{grid-row:1/4;align-self:center;text-align:right;font-family:"IBM Plex Mono",monospace;font-size:13px}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:600;padding:2px 8px;border-radius:999px;background:var(--surface3);color:var(--ink2);letter-spacing:.02em;white-space:nowrap}
.chip .d{width:6px;height:6px;border-radius:50%;background:currentColor}
.chip.good{background:var(--accent-soft);color:var(--accent)}
.chip.amber{background:var(--amber-soft);color:var(--amber)}
.chip.crit{background:var(--crit-soft);color:var(--crit)}
.chip.info{background:var(--info-soft);color:var(--info)}
.chip.new{background:var(--ink);color:var(--ground)}
.main{padding:18px 22px 40px;min-width:0}
.claimhead{display:flex;justify-content:space-between;gap:16px;align-items:flex-start;flex-wrap:wrap}
.claimhead .meta{display:flex;gap:16px;flex-wrap:wrap;margin-top:6px;font-size:13px;color:var(--ink2)}
.claimhead .meta b{color:var(--ink);font-weight:500}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:10px 16px;border-radius:10px;font-weight:600;font-size:14px;background:var(--accent);color:var(--accent-ink);transition:filter .15s,transform .08s;white-space:nowrap}
.btn:active{transform:scale(.98)}
.btn.secondary{background:var(--surface);color:var(--ink);border:1px solid var(--line)}
.btn.danger{background:var(--crit-soft);color:var(--crit)}
.btn.ghost{background:transparent;color:var(--accent);padding:6px 8px}
.btn[disabled]{opacity:.5;pointer-events:none}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:16px}
@media(max-width:900px){.grid{grid-template-columns:1fr}}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px}
.card.span{grid-column:1/-1}
.card h3{margin-bottom:8px}
.lines{width:100%;border-collapse:collapse;font-size:13px}
.lines th{text-align:left;font-size:11px;color:var(--ink3);text-transform:uppercase;letter-spacing:.06em;font-weight:600;padding:6px 0;border-bottom:1px solid var(--line)}
.lines td{padding:8px 0;border-bottom:1px solid var(--line);vertical-align:top}
.lines td.r,.lines th.r{text-align:right;font-family:"IBM Plex Mono",monospace;white-space:nowrap}
.lines tr:last-child td{border-bottom:0}
.lines .det{font-size:12px;color:var(--ink2);margin-top:2px}
.cite{color:var(--accent);font-weight:600;cursor:pointer;text-decoration:underline;text-underline-offset:2px}
.photos{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}
.ph{width:104px;height:78px;border-radius:9px;background:var(--surface3);display:flex;flex-direction:column;justify-content:flex-end;padding:6px 8px;font-size:11px;color:var(--ink2);position:relative;overflow:hidden;border:1px solid var(--line)}
.ph svg{position:absolute;inset:0;width:100%;height:100%;opacity:.55}
.ph.missing{border:1px dashed var(--crit);color:var(--crit);background:var(--crit-soft)}
.ph.blur{filter:none}.ph.blur svg{filter:blur(2px)}
.codes{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.code{font-family:"IBM Plex Mono",monospace;font-size:12px;padding:3px 7px;border-radius:6px;background:var(--amber-soft);color:var(--amber);font-weight:500}
.code.ok{background:var(--accent-soft);color:var(--accent)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:13px;margin:0}
.kv dt{color:var(--ink3)}.kv dd{margin:0}
.pipe{list-style:none;padding:0;margin:0}
.pipe li{display:grid;grid-template-columns:28px 1fr auto;gap:4px 12px;padding:10px 0;border-bottom:1px solid var(--line);align-items:start;opacity:.45;transition:opacity .3s}
.pipe li.run,.pipe li.done{opacity:1}
.pipe li .st{width:24px;height:24px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;grid-row:1/3}
.pipe li.run .st{border-color:var(--amber);border-top-color:transparent;animation:spin .8s linear infinite}
.pipe li.done .st{border-color:var(--accent);background:var(--accent);color:var(--accent-ink)}
.pipe li.done.flag .st{border-color:var(--amber);background:var(--amber);color:#fff}
.pipe li .st svg{width:12px;height:12px;opacity:0}.pipe li.done .st svg{opacity:1}
.pipe li .n{font-weight:600}
.pipe li .f{grid-column:2/4;font-size:13px;color:var(--ink2);display:none}
.pipe li.done .f{display:block}
.pipe li .c{font-family:"IBM Plex Mono",monospace;font-size:12px;color:var(--ink3);display:none}
.pipe li.done .c{display:block}
@keyframes spin{to{transform:rotate(360deg)}}
.verdict{border-radius:16px;padding:18px 20px;margin-top:16px;display:grid;grid-template-columns:1fr auto;gap:8px 20px;align-items:center;border:1px solid var(--line);background:var(--surface)}
.verdict.approved{border-color:var(--accent);background:var(--accent-soft)}
.verdict.denial{border-color:var(--crit);background:var(--crit-soft)}
.verdict.evidence{border-color:var(--amber);background:var(--amber-soft)}
.verdict.review{border-color:var(--info);background:var(--info-soft)}
.verdict h2{font-size:24px;letter-spacing:-.02em}
.verdict .sub{color:var(--ink2);font-size:14px;margin-top:2px}
.verdict .big{text-align:right}
.verdict .big b{display:block;font-family:"Bricolage Grotesque",sans-serif;font-size:30px;font-weight:800;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.verdict .big span{font-size:12px;color:var(--ink2);text-transform:uppercase;letter-spacing:.06em;font-weight:600}
.router{grid-column:1/-1;display:flex;gap:8px;flex-wrap:wrap;align-items:center;padding-top:10px;border-top:1px solid rgba(0,0,0,.08);font-size:13px}
.router .r{display:inline-flex;align-items:center;gap:6px;padding:4px 9px;border-radius:8px;background:var(--surface);border:1px solid var(--line)}
.router .r i{width:8px;height:8px;border-radius:50%;background:var(--accent)}
.router .r.warn i{background:var(--amber)}.router .r.bad i{background:var(--crit)}
.tabs{display:flex;gap:4px;margin-top:16px;border-bottom:1px solid var(--line);overflow-x:auto}
.tabs button{padding:10px 14px;font-weight:600;color:var(--ink3);border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap}
.tabs button.on{color:var(--ink);border-color:var(--accent)}
.panel{display:none;margin-top:14px}.panel.on{display:block}
.cite-card{background:var(--surface2);border-left:3px solid var(--accent);border-radius:0 10px 10px 0;padding:10px 12px;margin-top:8px}
.cite-card .sec{font-family:"IBM Plex Mono",monospace;font-size:12px;color:var(--accent);font-weight:500}
.cite-card p{font-size:13px;margin-top:3px}
.cite-card mark{background:var(--amber-soft);color:inherit;padding:0 2px;border-radius:3px}
.ev{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:900px){.ev{grid-template-columns:1fr}}
.finding{padding:10px 12px;border-radius:10px;background:var(--surface2);font-size:13px}
.finding b{display:block;margin-bottom:2px}
.finding .src{font-size:11px;color:var(--ink3);margin-top:4px}
.finding.pos{border-left:3px solid var(--accent)}.finding.neg{border-left:3px solid var(--crit)}.finding.warn{border-left:3px solid var(--amber)}
.diff{width:100%;border-collapse:collapse;font-size:13px;margin-top:6px}
.diff th,.diff td{padding:7px 8px;border-bottom:1px solid var(--line);text-align:left}
.diff th{font-size:11px;color:var(--ink3);text-transform:uppercase;letter-spacing:.06em}
.diff td.mono{font-size:12px}
.diff tr.hit td{background:var(--crit-soft)}
.diff tr.ok td{background:var(--accent-soft)}
.score{display:flex;align-items:center;gap:10px}
.score .bar{flex:1;height:8px;border-radius:4px;background:var(--line);overflow:hidden}
.score .bar i{display:block;height:100%;background:var(--accent)}
.score.warn .bar i{background:var(--amber)}.score.bad .bar i{background:var(--crit)}
.letter{white-space:pre-wrap;font-size:13px;line-height:1.55;background:var(--surface2);padding:14px 16px;border-radius:10px;border:1px solid var(--line)}
.letter b{font-weight:600}
.acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px;align-items:center}
.acts .note{font-size:12px;color:var(--ink3);margin-left:auto}
.overlay{position:fixed;inset:0;background:rgba(6,10,9,.55);z-index:20;display:none;align-items:center;justify-content:center;padding:16px}
.overlay.open{display:flex}
.modal{width:100%;max-width:720px;max-height:90dvh;overflow:auto;background:var(--surface);border-radius:18px;padding:20px 22px 24px;box-shadow:0 20px 60px rgba(0,0,0,.4);animation:up .22s ease}
@keyframes up{from{transform:translateY(16px);opacity:0}to{transform:none;opacity:1}}
.reasons{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
@media(max-width:600px){.reasons{grid-template-columns:1fr}}
.reasons button{padding:10px 12px;border-radius:10px;border:1px solid var(--line);text-align:left;background:var(--surface2);font-size:13px}
.reasons button.on{border-color:var(--accent);background:var(--accent-soft);color:var(--accent);font-weight:600}
textarea{width:100%;font:inherit;padding:10px;border-radius:10px;border:1px solid var(--line);background:var(--surface2);color:var(--ink);margin-top:10px;min-height:70px;resize:vertical}
.menu button.item{display:flex;width:100%;justify-content:space-between;align-items:center;padding:12px 0;border-bottom:1px solid var(--line);font-size:14px;text-align:left}
.menu .sec{font-size:11px;color:var(--ink3);text-transform:uppercase;letter-spacing:.08em;font-weight:600;margin:14px 0 2px}
.contrast{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:12px}
@media(max-width:600px){.contrast{grid-template-columns:1fr}}
.contrast .col{border-radius:12px;padding:14px;border:1px solid var(--line)}
.contrast .col.them{background:var(--surface2)}.contrast .col.us{background:var(--accent-soft);border-color:var(--accent)}
.contrast ul{padding-left:18px;margin:8px 0 0;font-size:13px}.contrast li{margin:5px 0}
.toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);background:var(--ink);color:var(--ground);padding:10px 16px;border-radius:999px;font-size:13px;font-weight:600;z-index:30;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.show{opacity:1}
.foot{font-size:11px;color:var(--ink3);margin-top:24px;line-height:1.4}
.label-chip{display:inline-flex;align-items:center;gap:6px;padding:6px 10px;border-radius:8px;background:var(--info-soft);color:var(--info);font-size:12px;font-weight:600}
</style>

const state={cur:null,phase:"intake",tab:"lines",labels:1208,stp:61};
const $=s=>document.querySelector(s);
const fmt=n=>"$"+Math.round(n).toLocaleString();
const byId=id=>CLAIMS.find(c=>c.id===id);
const STATUS={new:["New · not decided","new"],running:["Deciding…","amber"],approved:["Auto-approved · paid","good"],review:["Prepared · needs accept","info"],denial:["Prepared denial · needs accept","crit"],evidence:["Evidence requested","amber"],accepted:["Accepted · executed","good"],overridden:["Overridden · label captured","info"]};

function renderQueue(){
  $("#queue").innerHTML=CLAIMS.map(c=>{const st=STATUS[c.status];return `<button class="q ${state.cur===c.id?"on":""}" data-id="${c.id}"><span class="id mono">${c.id} · ${c.submitted}</span><span class="amt">${fmt(c.lines.reduce((a,l)=>a+l.amt,0))}</span><span class="veh">${c.vehicle}</span><span class="sub">${c.component} · ${c.shop}</span><span class="sub"><span class="chip ${st[1]}"><i class="d"></i>${st[0]}</span></span></button>`}).join("")
   +`<h4 style="margin-top:8px;padding:4px 4px 0">Earlier today</h4>`+OLDER.map(o=>`<div class="q" style="cursor:default"><span class="id mono">${o[0]}</span><span class="amt">${o[3]}</span><span class="veh">${o[1]}</span><span class="sub">${o[2]}</span><span class="sub"><span class="chip ${o[4]}"><i class="d"></i>${o[5]}</span></span></div>`).join("");
  $("#queue").querySelectorAll("[data-id]").forEach(b=>b.onclick=()=>open(b.dataset.id));
}
function open(id){state.cur=id;const c=byId(id);state.phase=(c.status==="new")?"intake":"decided";state.tab="lines";renderQueue();renderMain()}
function total(c){return c.lines.reduce((a,l)=>a+l.amt,0)}

function renderMain(){
  const c=byId(state.cur);if(!c){$("#main").innerHTML=`<div class="card"><h2>Select a claim</h2><p style="color:var(--ink2);margin-top:6px">Four new claims arrived this morning from partner shops.</p></div>`;return}
  const head=`<div class="claimhead"><div><div class="mono" style="font-size:12px;color:var(--ink3)">${c.id} · submitted ${c.submitted} via ${c.platform}</div><h1>${c.vehicle} · ${c.component}</h1>
    <div class="meta"><span>Shop <b>${c.shop}</b> <span class="chip">${c.shopTier}</span></span><span>Contract <b>${FORMS[c.form].name}</b> <span class="mono">${c.form}</span></span><span>Bound <b>${c.bound}</b> at ${c.boundOdo.toLocaleString()} mi</span><span>Now <b>${c.odo.toLocaleString()} mi</b>, ${c.days} days in</span><span>Submitted <b>${fmt(total(c))}</b></span></div></div>
    <div>${state.phase==="intake"?`<button class="btn" id="run">Run decision</button>`:state.phase==="running"?`<span class="chip amber"><i class="d"></i>Deciding</span>`:`<span class="chip ${STATUS[c.status][1]}"><i class="d"></i>${STATUS[c.status][0]}</span>`}</div></div>`;
  let body="";
  if(state.phase==="intake") body=renderIntake(c);
  else if(state.phase==="running") body=renderPipeline(c);
  else body=renderDecision(c);
  $("#main").innerHTML=head+body+`<p class="foot">Demonstration with synthetic contract forms, synthetic claims, and simulated model outputs. The rules core is real; the document, vision, and calibration layers are represented, not live.</p>`;
  if(state.phase==="intake"){$("#run").onclick=()=>runPipeline(c);$("#run2").onclick=()=>runPipeline(c)}
  if(state.phase==="running")animatePipeline(c);
  if(state.phase==="decided")wireDecision(c);
}
function renderIntake(c){
  return `<div class="grid">
    <div class="card"><h3>Repair order ${c.ro}</h3><dl class="kv"><dt>Complaint</dt><dd>${c.complaint}</dd><dt>Cause</dt><dd>${c.cause}</dd><dt>Correction</dt><dd>${c.correction}</dd><dt>Odometer</dt><dd class="mono">${c.odo.toLocaleString()} mi</dd></dl>
      <table class="lines" style="margin-top:10px"><tr><th>Line</th><th class="r">Amount</th></tr>${c.lines.map(l=>`<tr><td>${l.d}</td><td class="r">${fmt(l.amt)}</td></tr>`).join("")}<tr><td><b>Submitted total</b></td><td class="r"><b>${fmt(total(c))}</b></td></tr></table></div>
    <div class="card"><h3>Evidence received</h3><div class="photos">${c.photos.map(p=>ph(p[0],p[1],p[2])).join("")}</div>

      <h4 style="margin-top:14px">Sealed enrollment baseline</h4><p style="font-size:13px">${c.baseline.note}</p></div>
    <div class="card span" style="display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap"><div><b>Ready to decide.</b> <span style="color:var(--ink2)">One adjudication pass over the repair order, the evidence, the vehicle's own data, the sealed baseline, and the contract. Every determination will cite its clause.</span></div><button class="btn" id="run2">Run decision</button></div></div>`;
}
function runPipeline(c){c.status="running";state.phase="running";renderQueue();renderMain()}
function renderPipeline(c){
  return `<div class="card" style="margin-top:16px"><h3>Adjudication pass</h3><ul class="pipe" id="pipe">${c.pipeline.map(p=>`<li><span class="st">${ICON_CHECK}</span><span class="n">${p[0]}</span><span class="c">${Math.round(p[2]*100)}%</span><span class="f">${p[1]}</span></li>`).join("")}</ul></div>`;
}
function animatePipeline(c){
  const lis=[...document.querySelectorAll("#pipe li")];let i=0;
  const flagIdx=c.pipeline.map((p,k)=>p[2]<.9?k:-1).filter(k=>k>=0);
  const tick=()=>{if(i>0){lis[i-1].className="done"+(flagIdx.includes(i-1)?" flag":"")}if(i<lis.length){lis[i].className="run";i++;setTimeout(tick,380)}else setTimeout(()=>{c.status=c.decision.verdict;state.phase="decided";if(c.decision.verdict==="approved"){state.labels++;$("#st-labels").textContent=state.labels.toLocaleString()}renderQueue();renderMain();toast(c.decision.verdict==="approved"?"Decided in 1.3 s · authorization sent to shop":c.decision.verdict==="evidence"?"Shop asked for 2 items by SMS":"Routed to human review with reasoning attached")},300)};
  setTimeout(tick,150);
}
function cite(form,sec){return `<span class="cite" data-cite="${sec}">§${sec}</span>`}
function renderDecision(c){
  const d=c.decision,f=FORMS[c.form];
  const adjTotal=c.lines.reduce((a,l,k)=>{const det=d.dets[k];const m=/\(\$([\d,]+)\)/.exec(det.c);return a+(m?+m[1].replace(",",""):l.amt)},0);
  const v=`<section class="verdict ${d.verdict}"><div><div style="font-size:12px;letter-spacing:.06em;text-transform:uppercase;font-weight:600;color:var(--ink2)">${d.tier}</div><h2>${d.title}</h2><div class="sub">${d.verdict==="approved"?`Authorization sent to ${c.shop}. Payout ${fmt(d.payout)} after the ${fmt(d.deductible)} deductible, payable on invoice match.`:d.verdict==="review"?`Engine recommends approval. Amount above the auto-execute threshold, so a reviewer accepts with one click. Reasoning attached.`:d.verdict==="denial"?`Engine has prepared a denial with the clause and the baseline diff. HoldWell never auto-denies: a reviewer must accept, adjust, or override with a reason.`:`Covered in principle. The engine asked ${c.shop} for exactly the two items §7.2 requires. Provisional payout ${fmt(d.payout)} once they arrive.`}</div></div>
    <div class="big"><b>${d.verdict==="denial"?"$0":fmt(d.payout)}</b><span>${d.verdict==="evidence"?"provisional":"payout"} · confidence ${d.conf}%</span></div>
    <div class="router"><span style="color:var(--ink3);font-weight:600;font-size:12px;text-transform:uppercase;letter-spacing:.06em">Routing</span>${d.router.map(r=>`<span class="r ${r[1]==="ok"?"":r[1]==="warn"?"warn":"bad"}"><i></i>${r[0]}</span>`).join("")}</div></section>`;
  const tabs=`<div class="tabs">${[["lines","Lines"],["cites","Citations"],["evidence","Evidence"],["integrity","Integrity"],["outputs","Outputs"]].map(t=>`<button data-tab="${t[0]}" class="${state.tab===t[0]?"on":""}">${t[1]}</button>`).join("")}</div>`;
  const lines=`<div class="panel ${state.tab==="lines"?"on":""}" data-panel="lines"><div class="card"><table class="lines"><tr><th>Line</th><th>Determination</th><th class="r">Submitted</th><th class="r">Allowed</th></tr>
    ${c.lines.map((l,k)=>{const det=d.dets[k];const m=/\(\$([\d,]+)\)/.exec(det.c);const allowed=d.verdict==="denial"?0:(m?+m[1].replace(",",""):l.amt);return `<tr><td>${l.d}<div class="det">${l.type==="labor"?`Guide ${l.guide} h · cap ${(l.guide*1.1).toFixed(2)} h`:`Benchmark ${fmt(l.bench)} · ±15%`}</div></td><td><span class="chip ${/Excluded/.test(det.c)?"crit":/Adjusted/.test(det.c)?"amber":/pending/.test(det.c)?"amber":"good"}">${det.c}</span><div class="det">${det.note} · ${cite(c.form,det.cite)}</div></td><td class="r">${fmt(l.amt)}</td><td class="r">${fmt(allowed)}</td></tr>`}).join("")}
    <tr><td colspan="3"><b>Allowed total</b></td><td class="r"><b>${fmt(d.verdict==="denial"?0:adjTotal)}</b></td></tr><tr><td colspan="3">Deductible ${cite(c.form,"5.1")}</td><td class="r">−${fmt(d.verdict==="denial"?0:d.deductible)}</td></tr><tr><td colspan="3"><b>${d.verdict==="evidence"?"Provisional payout":"Payout"}</b></td><td class="r"><b>${fmt(d.verdict==="denial"?0:d.payout)}</b></td></tr></table></div></div>`;
  const usedSecs=[...new Set(d.dets.map(x=>x.cite).concat(d.verdict==="denial"?[]:["5.1"]).concat(c.id==="CL-2026-00421"?["2.3"]:[]).concat(c.id==="CL-2026-00408"?["3.5"]:[]).concat(c.id==="CL-2026-00417"?["6.1"]:[]).concat(c.id==="CL-2026-00425"?["7.2"]:[]))];
  const cites=`<div class="panel ${state.tab==="cites"?"on":""}" data-panel="cites"><div class="card"><h3>${f.name} · form ${c.form}</h3><p style="font-size:13px;color:var(--ink2)">Every determination above resolves to a clause. The contract was compiled to a coverage graph at issuance; the engine never re-reads the PDF at claim time.</p>${usedSecs.map(s=>`<div class="cite-card" id="cite-${s.replace(/[()]/g,"")}"><div class="sec">§${s}</div><p>${f.secs[s]||""}</p></div>`).join("")}</div></div>`;
  const ev=`<div class="panel ${state.tab==="evidence"?"on":""}" data-panel="evidence"><div class="ev">${d.evidence.map(e=>`<div class="finding ${e[0]}"><b>${e[1]}</b>${e[2]}<div class="src">Source: ${e[3]}</div></div>`).join("")}
    <div class="card" style="grid-column:1/-1"><h3>Vehicle witness: baseline vs now</h3><table class="diff"><tr><th>Signal</th><th>At enrollment (${c.bound})</th><th>Now</th><th>Read</th></tr>
    <tr class="${c.baseline.codes.length?"hit":"ok"}"><td>Diagnostic codes</td><td class="mono">${c.baseline.codes.length?c.baseline.codes.join(", "):"none"}</td><td class="mono">${c.dtc.length?c.dtc.join(", "):"none"}</td><td>${c.baseline.codes.length?"Claimed code present at bind":c.dtc.length?"New since enrollment":"No codes either time"}</td></tr>
    <tr><td>Odometer</td><td class="mono">${c.boundOdo.toLocaleString()}</td><td class="mono">${c.odo.toLocaleString()}</td><td>${(c.odo-c.boundOdo).toLocaleString()} mi in ${c.days} days</td></tr>
    <tr><td>Interim telemetry</td><td colspan="2">${c.baseline.interim}</td><td>${c.baseline.codes.length?"Continuous":c.dtc.length&&c.id!=="CL-2026-00425"?"Onset dated":"—"}</td></tr></table></div></div></div>`;
  const it=d.integrity;const cls=it.score>50?"bad":it.score>20?"warn":"";
  const integ=`<div class="panel ${state.tab==="integrity"?"on":""}" data-panel="integrity"><div class="card"><div class="score ${cls}"><b>Integrity risk</b><div class="bar"><i style="width:${it.score}%"></i></div><span class="mono">${it.score} / ${it.max}</span></div>
    <table class="diff" style="margin-top:12px">${it.items.map(x=>`<tr><td><b>${x[0]}</b></td><td>${x[1]}</td><td><span class="chip ${x[2]==="ok"?"good":x[2]==="warn"?"amber":"crit"}">${x[2]==="ok"?"Clear":x[2]==="warn"?"Watch":"Conflict"}</span></td></tr>`).join("")}</table>
    <p style="font-size:12px;color:var(--ink2);margin-top:10px">Integrity signals feed the authority tiers. Any conflict removes auto-execute. Shop scorecards update from claim one and adjust commission vesting per the IRF fraud framework.</p></div></div>`;
  const out=`<div class="panel ${state.tab==="outputs"?"on":""}" data-panel="outputs"><div class="grid" style="margin-top:0"><div class="card"><h3>To the shop</h3><div class="letter">${shopLetter(c)}</div></div><div class="card"><h3>To the customer</h3><div class="letter">${custLetter(c)}</div></div><div class="card span"><p style="font-size:13px;color:var(--ink2)">Both messages are rendered from the same decision object. There is no second model pass that could say something different to the shop than to the customer.</p></div></div></div>`;
  const acts=renderActs(c);
  return v+tabs+lines+cites+ev+integ+out+acts;
}
function renderActs(c){
  const d=c.decision;
  if(c.status==="accepted")return `<div class="acts"><span class="chip good"><i class="d"></i>Accepted by reviewer · executed</span><span class="label-chip">Training label captured · agreement</span></div>`;
  if(c.status==="overridden")return `<div class="acts"><span class="chip info"><i class="d"></i>Overridden · ${c.overrideReason}</span><span class="label-chip">Training label captured · override</span></div>`;
  if(d.verdict==="approved")return `<div class="acts"><span class="chip good"><i class="d"></i>Executed automatically</span><button class="btn secondary" data-override>Override with reason</button><span class="note">Auto-executed decisions stay reviewable for 30 days.</span></div>`;
  if(d.verdict==="evidence")return `<div class="acts"><button class="btn" data-remind>Resend request to shop</button><button class="btn secondary" data-simulate>Simulate: photos arrive</button><span class="note">Asked for: ${d.requests.join(" · ")}</span></div>`;
  return `<div class="acts"><button class="btn" data-accept>Accept ${d.verdict==="denial"?"denial":"and execute"}</button><button class="btn secondary" data-override>Override with reason</button>${d.verdict==="denial"?`<button class="btn secondary" data-adjust>Request more evidence instead</button>`:""}<span class="note">A human decides here. The reason code becomes a training label.</span></div>`;
}
function shopLetter(c){const d=c.decision;
  if(d.verdict==="denial")return `<b>${c.shop} · ${c.ro} · ${c.id}</b>\nAuthorization: <b>NOT APPROVED (pending reviewer)</b>\n\nThe claimed failure (${c.component}) matches code P0299 recorded on the vehicle's Condition of Record at enrollment on ${c.bound}. Under §3.2(b) of form ${c.form}, failures recorded at enrollment are excluded until repaired and verified.\n\nA HoldWell reviewer will confirm this decision today. If you have evidence that the P0299 condition was repaired and cleared before this failure, upload it and the claim will be re-run automatically.`;
  if(d.verdict==="evidence")return `<b>${c.shop} · ${c.ro} · ${c.id}</b>\nStatus: <b>TWO ITEMS NEEDED</b>\n\nThe compressor is covered under §2.7 and your parts and labor are in range. Before we can authorize ${fmt(d.payout)} we need exactly:\n1. ${d.requests[0]}\n2. ${d.requests[1]}\n\nReply to this text with the photos. No inspection will be scheduled. Decision re-runs on arrival.`;
  return `<b>${c.shop} · ${c.ro} · ${c.id}</b>\nAuthorization: <b>APPROVED</b> ${d.verdict==="review"?"(pending one-click reviewer accept)":""}\n\n${c.lines.map((l,k)=>`• ${l.d}: ${d.dets[k].c} (§${d.dets[k].cite})`).join("\n")}\n\nAllowed after ${fmt(d.deductible)} deductible: <b>${fmt(d.payout)}</b>.${c.id==="CL-2026-00417"?"\nLabor allowed at 4.18 h: guide 3.8 h plus the 10% cap in §4.1.":""}${c.id==="CL-2026-00408"?"\nModule-level repair authorized under §4.4 in place of pack replacement.":""}\nPayment by virtual card on invoice match. Collect the deductible from the customer.`;
}
function custLetter(c){const d=c.decision;const first="Jordan";
  if(d.verdict==="denial")return `Hi ${first},\n\nWe reviewed the turbocharger claim from ${c.shop}. When you enrolled on ${c.bound}, your truck was reporting code P0299, a turbo underboost condition, and it was listed on your Condition of Record. Your plan does not cover failures that were already present at enrollment (section 3.2(b)), so we cannot pay for this repair.\n\nA HoldWell reviewer is confirming this today. If the P0299 issue was repaired before this failure, send us the repair record and we will look again right away.`;
  if(d.verdict==="evidence")return `Hi ${first},\n\nGood news: your A/C compressor is covered. We've asked ${c.shop} for two quick photos so we can pay them directly. Once they arrive, HoldWell pays ${fmt(d.payout)} and you owe only the ${fmt(d.deductible)} deductible.\n\nNo inspection, no waiting for a call back.`;
  return `Hi ${first},\n\nYour ${c.component.toLowerCase()} repair at ${c.shop} is <b>approved</b>. HoldWell is paying ${fmt(d.payout)} directly to the shop. You owe the ${fmt(d.deductible)} deductible and nothing else.\n\n${c.id==="CL-2026-00417"?"Your car's own diagnostic data confirmed the fault, so no inspection was needed.":c.id==="CL-2026-00408"?"Your battery data showed a gradual decline in module 4, so we approved a module repair that restores your range without replacing the whole pack.":""}\n\nEvery line of this decision and the contract section behind it is in your HoldWell account.`;
}
function wireDecision(c){
  document.querySelectorAll("[data-tab]").forEach(b=>b.onclick=()=>{state.tab=b.dataset.tab;document.querySelectorAll("[data-tab]").forEach(x=>x.classList.toggle("on",x===b));document.querySelectorAll("[data-panel]").forEach(p=>p.classList.toggle("on",p.dataset.panel===state.tab))});
  document.querySelectorAll(".cite").forEach(s=>s.onclick=()=>{state.tab="cites";document.querySelector('[data-tab="cites"]').click();const el=document.getElementById("cite-"+s.dataset.cite.replace(/[()]/g,""));if(el){el.scrollIntoView({behavior:"smooth",block:"center"});el.style.boxShadow="0 0 0 3px var(--amber)";setTimeout(()=>el.style.boxShadow="",1400)}});
  const q=s=>document.querySelector(s);
  q("[data-accept]")&&(q("[data-accept]").onclick=()=>{c.status="accepted";state.labels++;$("#st-labels").textContent=state.labels.toLocaleString();renderQueue();renderMain();toast(c.decision.verdict==="denial"?"Denial letter sent · reviewer: J. Ghata":"Executed · authorization and payment released")});
  q("[data-override]")&&(q("[data-override]").onclick=()=>openOverride(c));
  q("[data-adjust]")&&(q("[data-adjust]").onclick=()=>{toast("Request sent: proof of P0299 repair before failure");});
  q("[data-remind]")&&(q("[data-remind]").onclick=()=>toast("Reminder sent to Peachtree Auto Repair by SMS"));
  q("[data-simulate]")&&(q("[data-simulate]").onclick=()=>{c.photos=[["Odometer 94,330","odo"],["Failed compressor clutch","part"],["Engine bay","bay"]];c.decision={...c.decision,verdict:"approved",title:"Approved · evidence complete",conf:93,tier:"Tier 1 · auto-execute",router:[["Sufficiency met §7.2","ok"],["Confidence 93% ≥ 90%","ok"],["Payout $1,050 < $3,000","ok"],["Integrity clear","ok"]],dets:c.decision.dets.map(x=>({...x,c:x.c.replace(", pending photo","").replace(", pending","")})),provisional:false,evidence:[["pos","Photos arrived and match","Compressor clutch photo shows bearing failure; odometer photo legible at 94,330","Vision model, 93%"],...c.decision.evidence.slice(2)],integrity:{...c.decision.integrity,score:12,items:c.decision.integrity.items.map(x=>x[0]==="Media"?[x[0],"Both items received, consistent","ok"]:x)}};c.status="approved";state.labels++;$("#st-labels").textContent=state.labels.toLocaleString();renderQueue();renderMain();toast("Re-run on arrival · approved in 1.1 s")});
}
function openOverride(c){
  const reasons=["Shop provided repair proof for baseline condition","Goodwill: long-tenured customer","Labor guide does not fit this repair","Parts benchmark stale for this region","Vision finding incorrect on review","Coverage graph misread clause","Fraud suspected: hold and investigate","Other"];
  let pick=null;
  openModal(`<h2>Override the prepared decision</h2><p style="color:var(--ink2);margin-top:4px;font-size:13px">A reason code is required. It is stored with the decision diff as a training label, and the engine re-evaluates similar claims against it.</p>
    <div class="reasons">${reasons.map((r,k)=>`<button data-r="${k}">${r}</button>`).join("")}</div><textarea placeholder="Optional note for the audit trail"></textarea>
    <div class="acts"><button class="btn" id="ov-save" disabled>Save override</button><button class="btn secondary" id="ov-cancel">Cancel</button></div>`);
  $("#modal").querySelectorAll("[data-r]").forEach(b=>b.onclick=()=>{pick=b.textContent;$("#modal").querySelectorAll("[data-r]").forEach(x=>x.classList.toggle("on",x===b));$("#ov-save").disabled=false});
  $("#ov-save").onclick=()=>{c.status="overridden";c.overrideReason=pick;state.labels++;$("#st-labels").textContent=state.labels.toLocaleString();closeModal();renderQueue();renderMain();toast("Override saved · training label captured")};
  $("#ov-cancel").onclick=closeModal;
}
/* ---------- Modal, menu, toast ---------- */
function openModal(html){$("#modal").innerHTML=html;$("#overlay").classList.add("open")}
function closeModal(){$("#overlay").classList.remove("open")}
$("#overlay").addEventListener("click",e=>{if(e.target.id==="overlay")closeModal()});
document.addEventListener("keydown",e=>{if(e.key==="Escape")closeModal()});
let tt;function toast(m){const t=$("#toast");t.textContent=m;t.classList.add("show");clearTimeout(tt);tt=setTimeout(()=>t.classList.remove("show"),2200)}
$("#gear").onclick=()=>{
  openModal(`<h2>Presenter</h2><div class="menu">
    <div class="sec">Open claim</div>${CLAIMS.map(c=>`<button class="item" data-open="${c.id}"><span>${c.vehicle} · ${c.component}</span><span>${STATUS[c.status][0]}</span></button>`).join("")}
    <div class="sec">Show</div>
    <button class="item" data-contrast><span>Incumbent vs HoldWell (the four-answers problem)</span><span>›</span></button>
    <button class="item" data-theme><span>Theme</span><span>${document.documentElement.dataset.theme||"System"}</span></button>
    <div style="margin-top:16px"><button class="btn secondary" data-reset>Reset all claims</button></div></div>`);
  $("#modal").querySelectorAll("[data-open]").forEach(b=>b.onclick=()=>{closeModal();open(b.dataset.open)});
  $("#modal").querySelector("[data-contrast]").onclick=()=>openContrast();
  $("#modal").querySelector("[data-theme]").onclick=()=>{const r=document.documentElement;const cur=r.dataset.theme;r.dataset.theme=cur==="dark"?"light":cur==="light"?"":"dark";if(!r.dataset.theme)delete r.dataset.theme;closeModal()};
  $("#modal").querySelector("[data-reset]").onclick=()=>{location.reload()};
};
function openContrast(){
  openModal(`<h2>One claim, four answers vs one decision</h2><p style="font-size:13px;color:var(--ink2);margin-top:4px">From a hands-on review of the incumbent claims AI (July 2026) against the same kind of claim.</p>
    <div class="contrast"><div class="col them"><h3>Incumbent: advisory sidecar</h3><ul><li>AI analysis: <b>deny at $0</b></li><li>AI assistant: <b>"covered in principle"</b></li><li>Risk score <b>104 / 350</b>, confidence <b>30%</b></li><li>Priority: <b>EXTREME</b></li><li>Separate app, separate claim ID, sync button back to the system of record</li><li>Odometer verified from a dash photo. OBD field: "Not provided"</li><li>No enrollment baseline to adjudicate against</li><li>Confirm and reject buttons train nothing</li></ul></div>
    <div class="col us"><h3>HoldWell: the decision</h3><ul><li>One decision object; every surface is a projection of it</li><li>Every line cites a clause; a denial without a citation is impossible</li><li>The vehicle is a witness: codes, odometer, and the sealed baseline</li><li>Calibrated confidence drives authority tiers, not a color</li><li>Straight-through for the middle of the distribution, not just trivial claims</li><li>Missing evidence gets an exact request, not an inspection</li><li>Humans decide the hard cases, and every override is a label</li></ul></div></div>
    <div class="acts"><button class="btn secondary" id="ct-close">Close</button></div>`);
  $("#ct-close").onclick=closeModal;
}
renderQueue();open(CLAIMS[0].id);
</script>
